- name: for Running commands
  hosts: localhost
  connection: local
  vars_prompt:
    - name: command
      prompt: enter your command
      private: false
  become: yes
  tasks:
    - name: to know listening ports
      ansible.builtin.command: '{{command}}'
      register: listening_ports

    - name: print output for above command
      ansible.builtin.debug:
        msg: '{{listening_ports}}'